<extend template="base.shtml">
<head id="head">
  <style>
    .date {
      font-size: 0.9em;
    }
    
    .title h3{
      margin-bottom: 0;
    }

    .preview{
      margin-left: 20px;
      font-style: italic;
    }

    .preview *{
      display:none;
    }

    .preview p:first-child{
      display: block;
      text-overflow: ellipsis; 
      overflow: hidden;
      white-space: nowrap;
    }
  </style>
</head>
<body id="body">
  <h1 :text="$page.title"></h1>
  <div :html="$page.content()"></div>
  <div>
    <h2>Notes</h2>
    <div :loop="$page.subpages()">
      <a class="title" href="$loop.it.link()">
        <h3 :text="$loop.it.title"></h3>
      </a>
      <span class="date" :text="$loop.it.date.format('2006')"></span>
      <div class="preview" :html="$loop.it.content()"></div>
    </div>
  </div>
</body>
